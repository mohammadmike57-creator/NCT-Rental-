<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#carGradient)"/>

  <!-- Car Icon -->
  <g transform="translate(20, 35)">
    <!-- Car Body -->
    <path d="M5 15 L10 5 L35 5 L42 15 Z" fill="white" opacity="0.9"/>
    <rect x="0" y="15" width="60" height="15" rx="2" fill="white"/>

    <!-- Windows -->
    <rect x="12" y="8" width="10" height="8" fill="#3B82F6" opacity="0.5"/>
    <rect x="25" y="8" width="10" height="8" fill="#3B82F6" opacity="0.5"/>

    <!-- Wheels -->
    <circle cx="12" cy="30" r="5" fill="#1F2937"/>
    <circle cx="12" cy="30" r="3" fill="#6B7280"/>
    <circle cx="48" cy="30" r="5" fill="#1F2937"/>
    <circle cx="48" cy="30" r="3" fill="#6B7280"/>

    <!-- Headlight -->
    <circle cx="55" cy="20" r="2" fill="#FCD34D"/>
  </g>

  <!-- NCT Text -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">NCT</text>
</svg>
