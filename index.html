<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NCT Rental</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Apple PWA Tags for app-like experience on iOS -->
    <link rel="apple-touch-icon" href="/images/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NCT Rental">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  .font-sans-ui { font-family: 'Inter', sans-serif; }
  .font-serif-professional { font-family: 'Lora', serif; }
  
  /* For Firefox */
  * {
    scrollbar-width: thin;
    scrollbar-color: #94a3b8 #e2e8f0; /* thumb and track color */
  }

  @media print {
    body {
        background-color: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    .no-print, .no-print * {
        display: none !important;
    }
    .voucher-container {
        position: static !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: none !important;
        display: block !important;
        overflow: visible !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
    }
    .voucher-scroll-content {
        overflow: visible !important;
        height: auto !important;
        padding: 0 !important;
    }
    .printable-area {
        padding: 0 !important;
        margin: 0 !important;
        border: none !important;
        box-shadow: none !important;
    }
  }
</style>
</head>
  <body class="bg-slate-50 font-sans-ui">
    <div id="root">
      <!-- Shown instantly while the app downloads (replaced by React once it starts). -->
      <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f172a;color:#e2e8f0;font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px;text-align:center">
        <div style="font-size:20px;font-weight:600;color:#fff;letter-spacing:-.01em">NCT Rental</div>
        <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#818cf8;border-radius:50%;animation:bootspin .8s linear infinite"></div>
        <div id="boot-msg" style="font-size:13px;color:#94a3b8;max-width:320px">Loading the system…</div>
        <button id="boot-retry" onclick="location.reload()" style="display:none;margin-top:4px;padding:9px 16px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:13px;font-weight:600">Reload</button>
      </div>
    </div>
    <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
    <script>
      // Plain script (runs on any browser): explain a slow start or a browser that cannot run the app.
      (function () {
        function show(msg) {
          var m = document.getElementById('boot-msg'), r = document.getElementById('boot-retry');
          if (!m) return; m.textContent = msg; if (r) r.style.display = 'inline-block';
        }
        setTimeout(function () { show('Still loading — the server may be starting up. This can take up to a minute the first time.'); }, 12000);
        setTimeout(function () { show('The system did not start. Check your connection and tap Reload. If it keeps happening, update your browser (Safari or Chrome).'); }, 60000);
        window.addEventListener('error', function (e) {
          if (document.getElementById('boot')) show('This browser could not start the system. Please update Safari or Chrome, then tap Reload.');
        });
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
