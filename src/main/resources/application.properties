# ===================================
# NCT RENTAL - PROFESSIONAL CRM SYSTEM
# Enterprise-Grade Configuration
# ===================================

spring.application.name=nct-rental-backend
server.port=${PORT:8080}

# ===================================
# DATABASE CONFIGURATION
# ===================================
# Development: H2 (default)
# Production: PostgreSQL (uncomment and configure)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:carrental;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# PostgreSQL (Production)
# spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nct_rental}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:yourpassword}
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================
# SECURITY & AUTHENTICATION
# ===================================
# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJwtTokenGenerationWithAtLeast32CharactersLongForProductionUsage}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Session Management
app.session.max-concurrent=${MAX_CONCURRENT_SESSIONS:3}
app.session.timeout-minutes=${SESSION_TIMEOUT_MINUTES:30}
app.session.max-duration-hours=${SESSION_MAX_DURATION_HOURS:24}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://nct-rental.vercel.app,https://www.nctrental.com}

# ===================================
# STRIPE PAYMENT GATEWAY
# ===================================
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.id=${STRIPE_PRICE_ID:}
app.base-url=${APP_BASE_URL:https://www.nctrental.com}

# ===================================
# EMAIL SERVICE (SMTP)
# ===================================
mail.smtp.enabled=${MAIL_ENABLED:false}
mail.smtp.host=${MAIL_HOST:smtp.gmail.com}
mail.smtp.port=${MAIL_PORT:587}
mail.smtp.username=${MAIL_USERNAME:}
mail.smtp.password=${MAIL_PASSWORD:}
mail.smtp.from=${MAIL_FROM:noreply@nctrental.com}
mail.smtp.from.name=${MAIL_FROM_NAME:NCT Rental}

# ===================================
# SMS SERVICE (TWILIO)
# ===================================
sms.enabled=${SMS_ENABLED:false}
sms.provider=${SMS_PROVIDER:twilio}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ===================================
# NOTIFICATION SYSTEM
# ===================================
app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}

# ===================================
# FILE UPLOAD
# ===================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ===================================
# LOGGING
# ===================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.com.carrental.backend=${LOG_LEVEL_APP:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===================================
# ACTUATOR (MONITORING)
# ===================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# ===================================
# CACHING (REDIS - OPTIONAL)
# ===================================
spring.cache.type=${CACHE_TYPE:simple}
# spring.redis.host=${REDIS_HOST:localhost}
# spring.redis.port=${REDIS_PORT:6379}
# spring.redis.password=${REDIS_PASSWORD:}

# ===================================
# APPLICATION INFO
# ===================================
app.name=NCT Rental CRM
app.version=2.0.0
app.description=Enterprise-Grade Car Rental Management System
