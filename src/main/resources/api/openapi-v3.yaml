openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: UR-Drive Distribution API
  version: 3.0.0
  description: |
    Car-rental supplier API of UR-Drive Jordan. Brokers search availability, receive quotes, book, retrieve,
    modify and cancel. Operational dates and deadlines follow Asia/Amman. Vehicle groups are ACRISS/SIPP codes.
    Reservation numbers are RSV-YYYY-NNNNNN. Every response carries status, requestId, correlationId,
    apiVersion and timestamp. Additive changes only within v3; breaking changes need /api/v4.
  contact: { name: UR-Drive Jordan connectivity }
servers:
  - url: https://www.nctrental.com/api/v3
security:
  - oauth2: []
tags:
  - { name: Reference data }
  - { name: Availability and quotes }
  - { name: Reservations }
  - { name: Inventory }
  - { name: Webhooks, description: 'Signed with HMAC-SHA256 (URD-Webhook-Signature), retried for 72 hours, then the dead-letter list' }
  - { name: Platform }
paths:
  /health:
    get:
      tags: [Platform]
      summary: API health
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /locations:
    get:
      tags: [Reference data]
      summary: Locations sold to the channel
      security: [{ oauth2: [locations:read] }]
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '304': { description: Not modified (ETag matched) }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /locations/{locationCode}:
    get:
      tags: [Reference data]
      summary: One location with address, hours and coordinates
      security: [{ oauth2: [locations:read] }]
      parameters:
        - { name: locationCode, in: path, required: true, schema: { $ref: '#/components/schemas/LocationCode' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/Error' }
  /fleet-groups:
    get:
      tags: [Reference data]
      summary: Vehicle groups (ACRISS)
      security: [{ oauth2: [fleet:read] }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /extras:
    get:
      tags: [Reference data]
      summary: Extras with prices and caps
      security: [{ oauth2: [fleet:read] }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /insurance-covers:
    get:
      tags: [Reference data]
      summary: Insurance covers, included and optional
      security: [{ oauth2: [fleet:read] }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /availability/search:
    post:
      tags: [Availability and quotes]
      summary: Free vehicle groups for the whole period, priced, each with a quoteId
      security: [{ oauth2: [availability:read] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SearchRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /quotes/{quoteId}:
    get:
      tags: [Availability and quotes]
      summary: Re-validate a quote (holds a car for a short time)
      security: [{ oauth2: [quotes:read] }]
      parameters: [{ $ref: '#/components/parameters/QuoteId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Error' }
  /quotes/{quoteId}/rules:
    get:
      tags: [Availability and quotes]
      summary: Full terms of a quote (cancellation, deposit, mileage, covers, fees)
      security: [{ oauth2: [quotes:read] }]
      parameters: [{ $ref: '#/components/parameters/QuoteId' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /reservations:
    post:
      tags: [Reservations]
      summary: Book from a quoteId, or directly from an itinerary
      security: [{ oauth2: [reservations:write] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BookingRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      tags: [Reservations]
      summary: Reservations by pick-up date, cursor-paged
      security: [{ oauth2: [reservations:read] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReservationStatus' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /reservations/{reservationId}:
    get:
      tags: [Reservations]
      summary: Retrieve by RSV number or broker reference
      security: [{ oauth2: [reservations:read] }]
      parameters: [{ $ref: '#/components/parameters/ReservationId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Reservations]
      summary: Modify (re-priced)
      security: [{ oauth2: [reservations:write] }]
      parameters: [{ $ref: '#/components/parameters/ReservationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Reservations]
      summary: Cancel (same as POST .../cancellations)
      security: [{ oauth2: [reservations:write] }]
      parameters: [{ $ref: '#/components/parameters/ReservationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /reservations/{reservationId}/cancellations:
    post:
      tags: [Reservations]
      summary: Cancel; the response gives the fee and refund
      security: [{ oauth2: [reservations:write] }]
      parameters: [{ $ref: '#/components/parameters/ReservationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /inventory:
    get:
      tags: [Inventory]
      summary: Free cars per vehicle group per day
      security: [{ oauth2: [inventory:read] }]
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365 } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /webhooks/subscriptions:
    get:
      tags: [Webhooks]
      summary: Your webhook subscriptions in this environment
      security: [{ oauth2: [webhooks:manage] }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Webhooks]
      summary: Subscribe an HTTPS address; the signing secret is returned once
      security: [{ oauth2: [webhooks:manage] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionRequest' } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/Error' } }
  /webhooks/subscriptions/{subscriptionId}:
    patch:
      tags: [Webhooks]
      summary: Change the address or events, or pause (status PAUSED) and resume (ACTIVE)
      security: [{ oauth2: [webhooks:manage] }]
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Webhooks]
      summary: Delete the subscription
      security: [{ oauth2: [webhooks:manage] }]
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /webhooks/subscriptions/{subscriptionId}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: New signing secret; the old one also signs for 72 hours
      security: [{ oauth2: [webhooks:manage] }]
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /webhooks/subscriptions/{subscriptionId}/test:
    post:
      tags: [Webhooks]
      summary: Send a signed webhook.test event now
      security: [{ oauth2: [webhooks:manage] }]
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: Recent deliveries with status, attempts and the dead-letter list (status DEAD_LETTER)
      security: [{ oauth2: [webhooks:manage] }]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [PENDING, DELIVERED, DEAD_LETTER] } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /webhooks/deliveries/{deliveryId}/replay:
    post:
      tags: [Webhooks]
      summary: Send a delivery again (also from the dead-letter list)
      security: [{ oauth2: [webhooks:manage] }]
      parameters: [{ name: deliveryId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://www.nctrental.com/oauth/token
          scopes:
            locations:read: Read locations
            fleet:read: Read vehicle groups, extras and covers
            availability:read: Search availability
            quotes:read: Read quotes and their rules
            reservations:read: Read reservations
            reservations:write: Create, modify and cancel reservations
            inventory:read: Read inventory
            webhooks:manage: Manage webhook subscriptions
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
    IfNoneMatch: { name: If-None-Match, in: header, schema: { type: string } }
    QuoteId: { name: quoteId, in: path, required: true, schema: { type: string } }
    ReservationId: { name: reservationId, in: path, required: true, schema: { type: string } }
    SubscriptionId: { name: subscriptionId, in: path, required: true, schema: { type: string, examples: [whsub_8f2k1] } }
  responses:
    Ok:
      description: Success envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    LocationCode: { type: string, pattern: '^[A-Z0-9]{3,10}$', examples: [AMM, AMMDT] }
    Acriss: { type: string, pattern: '^[A-Z]{4}$', examples: [CDAR, IDAR] }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?\d+(\.\d{1,3})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ReservationStatus: { type: string, enum: [PENDING, CONFIRMED, CANCELLED, NO_SHOW, PICKED_UP, COMPLETED] }
    SearchRequest:
      type: object
      properties:
        pickUp: { type: object, properties: { location: { $ref: '#/components/schemas/LocationCode' }, local: { type: string, description: 'Asia/Amman local time, YYYY-MM-DDTHH:mm' } } }
        return: { type: object, properties: { location: { $ref: '#/components/schemas/LocationCode' }, local: { type: string } } }
        driverAge: { type: integer, minimum: 16 }
        vehicleGroup: { $ref: '#/components/schemas/Acriss' }
        extras: { type: array, items: { type: object, properties: { code: { type: string }, quantity: { type: integer } } } }
        coverages: { type: array, items: { type: string } }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        promoCode: { type: string }
    BookingRequest:
      type: object
      required: [customer]
      properties:
        quoteId: { type: string, description: 'From availability/search; the quoted total is guaranteed while it is valid' }
        brokerReference: { type: string, maxLength: 60 }
        itinerary: { $ref: '#/components/schemas/SearchRequest' }
        customer:
          type: object
          required: [lastName]
          properties: { title: { type: string }, firstName: { type: string }, lastName: { type: string }, email: { type: string, format: email }, phone: { type: string }, country: { type: string } }
        driver:
          type: object
          properties: { firstName: { type: string }, lastName: { type: string }, dateOfBirth: { type: string, format: date }, licenceNumber: { type: string }, licenceCountry: { type: string } }
        expectedTotal: { type: number }
        flightNumber: { type: string }
        comments: { type: string }
    SubscriptionRequest:
      type: object
      properties:
        url: { type: string, format: uri, description: 'HTTPS only; private addresses are refused' }
        events:
          type: array
          items: { type: string, enum: [reservation.created, reservation.confirmed, reservation.modified, reservation.cancelled, reservation.no_show, reservation.picked_up, agreement.created, agreement.closed, inventory.updated] }
        status: { type: string, enum: [ACTIVE, PAUSED] }
    Envelope:
      type: object
      required: [status, requestId, correlationId, apiVersion, timestamp]
      properties:
        status: { const: success }
        requestId: { type: string }
        correlationId: { type: string }
        apiVersion: { type: string, examples: ['3.0.0'] }
        timestamp: { type: string, format: date-time }
        environment: { enum: [sandbox, production] }
        data: { type: object }
    ErrorEnvelope:
      type: object
      required: [status, requestId, correlationId, apiVersion, timestamp, error]
      properties:
        status: { const: error }
        requestId: { type: string }
        correlationId: { type: string }
        apiVersion: { type: string }
        timestamp: { type: string, format: date-time }
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string, description: 'See GET /ota/errors for the full catalogue' }
            message: { type: string }
            otaCode: { type: string }
            retryable: { type: boolean }
