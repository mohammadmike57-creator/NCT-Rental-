# NOT LOADED BY THE APPLICATION. Reference only: this file used to live in
# src/main/resources and activated the "production" profile by default, which
# pointed the datasource at ${DB_HOST} and required libraries the project does
# not include. Runtime configuration lives in src/main/resources/application.properties.

# ========================================
# NCT Rental System - Production Configuration
# ========================================

spring:
  profiles:
    active: ${SPRING_PROFILE:production}

  application:
    name: nct-rental-system
    version: 3.2.0

---
# ========================================
# DEVELOPMENT PROFILE
# ========================================
spring:
  config:
    activate:
      on-profile: development

  # Database Configuration - H2 for Development
  datasource:
    url: jdbc:h2:mem:nct_rental_dev
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: NCT-HikariCP-Dev
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Mail Configuration - Console for Development
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@nct-rental.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

  # File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    timeout: 60000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET:nct-rental-dev-secret-key-change-in-production-minimum-512-bits}
    expiration: 86400000  # 24 hours
    refresh-expiration: 604800000  # 7 days
  oauth2:
    enabled: false
  two-factor:
    enabled: false

# Application Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600

  rate-limit:
    enabled: true
    requests-per-minute: 100

# Cloud Storage - Local for Development
cloud:
  storage:
    provider: local
    local:
      base-path: ./uploads
    aws:
      s3:
        enabled: false
        bucket: ${AWS_S3_BUCKET:}
        region: ${AWS_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}

# Payment Gateway - Test Mode
payment:
  stripe:
    enabled: true
    test-mode: true
    public-key: ${STRIPE_PUBLIC_KEY:}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# SMS Provider
sms:
  twilio:
    enabled: false
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}

# Logging
logging:
  level:
    root: INFO
    com.nct.rental: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/nct-rental-dev.log
    max-size: 10MB
    max-history: 7

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: on_param

---
# ========================================
# STAGING PROFILE
# ========================================
spring:
  config:
    activate:
      on-profile: staging

  # Database Configuration - PostgreSQL for Staging
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nct_rental_staging}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: NCT-HikariCP-Staging
      minimum-idle: 10
      maximum-pool-size: 30
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false

  # Mail Configuration - SMTP
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${MAIL_HOST:smtp.gmail.com}
    test-connection: true

  # File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 60000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /nct-rental
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 43200000  # 12 hours
    refresh-expiration: 259200000  # 3 days
  oauth2:
    enabled: ${OAUTH2_ENABLED:false}
    client-id: ${OAUTH2_CLIENT_ID:}
    client-secret: ${OAUTH2_CLIENT_SECRET:}
    authorization-uri: ${OAUTH2_AUTHORIZATION_URI:}
    token-uri: ${OAUTH2_TOKEN_URI:}
    user-info-uri: ${OAUTH2_USER_INFO_URI:}
  two-factor:
    enabled: true
    issuer: NCT Rental System

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://staging.nct-rental.com}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600

  rate-limit:
    enabled: true
    requests-per-minute: 60

  ip-whitelist:
    enabled: ${IP_WHITELIST_ENABLED:false}
    addresses: ${IP_WHITELIST:}

# Cloud Storage - AWS S3
cloud:
  storage:
    provider: aws-s3
    aws:
      s3:
        enabled: true
        bucket: ${AWS_S3_BUCKET}
        region: ${AWS_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
        endpoint: ${AWS_S3_ENDPOINT:}
        path-style-access: false

# Payment Gateway - Test Mode
payment:
  stripe:
    enabled: true
    test-mode: true
    public-key: ${STRIPE_PUBLIC_KEY}
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  paypal:
    enabled: ${PAYPAL_ENABLED:false}
    mode: sandbox
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}

# SMS Provider
sms:
  twilio:
    enabled: ${TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}

# OTA Integration
ota:
  booking:
    enabled: ${BOOKING_COM_ENABLED:false}
    api-key: ${BOOKING_COM_API_KEY:}
    hotel-id: ${BOOKING_COM_HOTEL_ID:}
    webhook-url: ${API_BASE_URL}/webhooks/booking
  expedia:
    enabled: ${EXPEDIA_ENABLED:false}
    api-key: ${EXPEDIA_API_KEY:}
    hotel-id: ${EXPEDIA_HOTEL_ID:}
    webhook-url: ${API_BASE_URL}/webhooks/expedia
  airbnb:
    enabled: ${AIRBNB_ENABLED:false}
    api-key: ${AIRBNB_API_KEY:}
    listing-id: ${AIRBNB_LISTING_ID:}
    webhook-url: ${API_BASE_URL}/webhooks/airbnb

# Logging
logging:
  level:
    root: INFO
    com.nct.rental: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/nct-rental-staging.log
    max-size: 50MB
    max-history: 30

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: staging

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  error:
    include-message: always
    include-stacktrace: never

---
# ========================================
# PRODUCTION PROFILE
# ========================================
spring:
  config:
    activate:
      on-profile: production

  # Database Configuration - PostgreSQL for Production
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:nct_rental_prod}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: NCT-HikariCP-Production
      minimum-idle: 20
      maximum-pool-size: 100
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

  # Mail Configuration - Production SMTP
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${MAIL_HOST}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: true

  # File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # Redis Configuration
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 60000
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10
      shutdown-timeout: 100ms
    ssl: ${REDIS_SSL:false}

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/nct-rental}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 5
          multiplier: 2
        acknowledge-mode: auto
        prefetch: 10
    ssl:
      enabled: ${RABBITMQ_SSL:false}

  # Kafka Configuration (Optional)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: nct-rental-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000  # 1 hour
    refresh-expiration: 86400000  # 24 hours
  oauth2:
    enabled: ${OAUTH2_ENABLED:false}
    client-id: ${OAUTH2_CLIENT_ID:}
    client-secret: ${OAUTH2_CLIENT_SECRET:}
    authorization-uri: ${OAUTH2_AUTHORIZATION_URI:}
    token-uri: ${OAUTH2_TOKEN_URI:}
    user-info-uri: ${OAUTH2_USER_INFO_URI:}
  saml:
    enabled: ${SAML_ENABLED:false}
    entity-id: ${SAML_ENTITY_ID:}
    idp-metadata-url: ${SAML_IDP_METADATA_URL:}
  ldap:
    enabled: ${LDAP_ENABLED:false}
    url: ${LDAP_URL:}
    base: ${LDAP_BASE:}
    username: ${LDAP_USERNAME:}
    password: ${LDAP_PASSWORD:}
  two-factor:
    enabled: true
    issuer: NCT Rental System

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600

  rate-limit:
    enabled: true
    requests-per-minute: 60
    endpoints:
      /api/bookings: 30
      /api/vehicles: 100
      /api/customers: 50
      /api/reports: 20

  ip-whitelist:
    enabled: ${IP_WHITELIST_ENABLED:false}
    addresses: ${IP_WHITELIST:}

  session:
    timeout: 3600  # 1 hour in seconds

# Cloud Storage - AWS S3
cloud:
  storage:
    provider: ${STORAGE_PROVIDER:aws-s3}
    aws:
      s3:
        enabled: true
        bucket: ${AWS_S3_BUCKET}
        region: ${AWS_REGION}
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
        endpoint: ${AWS_S3_ENDPOINT:}
        path-style-access: false
        encryption: AES256
    azure:
      blob:
        enabled: false
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
        container-name: ${AZURE_CONTAINER_NAME:}
    google:
      cloud:
        enabled: false
        project-id: ${GCP_PROJECT_ID:}
        bucket: ${GCP_BUCKET:}
        credentials-path: ${GCP_CREDENTIALS_PATH:}

# Payment Gateway - Production Mode
payment:
  stripe:
    enabled: ${STRIPE_ENABLED:true}
    test-mode: false
    public-key: ${STRIPE_PUBLIC_KEY}
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  paypal:
    enabled: ${PAYPAL_ENABLED:false}
    mode: live
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
  square:
    enabled: ${SQUARE_ENABLED:false}
    application-id: ${SQUARE_APPLICATION_ID:}
    access-token: ${SQUARE_ACCESS_TOKEN:}
    location-id: ${SQUARE_LOCATION_ID:}

# SMS Provider
sms:
  twilio:
    enabled: ${TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
  nexmo:
    enabled: ${NEXMO_ENABLED:false}
    api-key: ${NEXMO_API_KEY:}
    api-secret: ${NEXMO_API_SECRET:}
    from-number: ${NEXMO_FROM_NUMBER:}
  aws-sns:
    enabled: ${AWS_SNS_ENABLED:false}
    region: ${AWS_SNS_REGION:}
    access-key: ${AWS_SNS_ACCESS_KEY:}
    secret-key: ${AWS_SNS_SECRET_KEY:}

# Analytics
analytics:
  google:
    enabled: ${GOOGLE_ANALYTICS_ENABLED:false}
    tracking-id: ${GOOGLE_ANALYTICS_ID:}
  mixpanel:
    enabled: ${MIXPANEL_ENABLED:false}
    token: ${MIXPANEL_TOKEN:}

# CRM Integration
crm:
  salesforce:
    enabled: ${SALESFORCE_ENABLED:false}
    client-id: ${SALESFORCE_CLIENT_ID:}
    client-secret: ${SALESFORCE_CLIENT_SECRET:}
    username: ${SALESFORCE_USERNAME:}
    password: ${SALESFORCE_PASSWORD:}
    security-token: ${SALESFORCE_SECURITY_TOKEN:}
  hubspot:
    enabled: ${HUBSPOT_ENABLED:false}
    api-key: ${HUBSPOT_API_KEY:}

# OTA Integration
ota:
  booking:
    enabled: ${BOOKING_COM_ENABLED:false}
    api-key: ${BOOKING_COM_API_KEY:}
    hotel-id: ${BOOKING_COM_HOTEL_ID:}
    webhook-url: ${API_BASE_URL}/webhooks/booking
    sync-interval: 300000  # 5 minutes
  expedia:
    enabled: ${EXPEDIA_ENABLED:false}
    api-key: ${EXPEDIA_API_KEY:}
    hotel-id: ${EXPEDIA_HOTEL_ID:}
    webhook-url: ${API_BASE_URL}/webhooks/expedia
    sync-interval: 300000  # 5 minutes
  airbnb:
    enabled: ${AIRBNB_ENABLED:false}
    api-key: ${AIRBNB_API_KEY:}
    listing-id: ${AIRBNB_LISTING_ID:}
    webhook-url: ${API_BASE_URL}/webhooks/airbnb
    sync-interval: 300000  # 5 minutes

# Backup Configuration
backup:
  enabled: true
  schedule: ${BACKUP_SCHEDULE:0 2 * * *}  # Daily at 2:00 AM
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  destination: ${BACKUP_DESTINATION:s3}
  s3:
    bucket: ${BACKUP_S3_BUCKET:}
    prefix: backups/

# Monitoring and Metrics
monitoring:
  enabled: true
  apm:
    enabled: ${APM_ENABLED:false}
    service-name: nct-rental-system
    server-url: ${APM_SERVER_URL:}

# Logging
logging:
  level:
    root: WARN
    com.nct.rental: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:/var/log/nct-rental/application.log}
    max-size: 100MB
    max-history: 90
    total-size-cap: 10GB

# Actuator - Production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: production
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  http2:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    accept-count: 100
    connection-timeout: 20000
